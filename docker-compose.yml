name: blog

# Configuración común de Laravel para las dos apps.
x-laravel-env: &laravel-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_LOCALE: es
  APP_FALLBACK_LOCALE: es
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
  APP_NAME: ${BLOG_TITLE:-Mi blog}
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  CACHE_STORE: file
  QUEUE_CONNECTION: sync
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${MYSQL_DATABASE}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_ADMIN_USER}
      MYSQL_PASSWORD: ${MYSQL_ADMIN_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Panel para escribir. SIN login: solo escucha en el localhost del servidor.
  admin:
    build: ./admin
    restart: unless-stopped
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-8080}:80"
    environment:
      <<: *laravel-env
      APP_KEY: ${ADMIN_APP_KEY}
      APP_URL: http://localhost:${ADMIN_PORT:-8080}
      BLOG_URL: ${BLOG_URL}
      SESSION_DRIVER: file
      DB_USERNAME: ${MYSQL_ADMIN_USER}
      DB_PASSWORD: ${MYSQL_ADMIN_PASSWORD}
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      mysql:
        condition: service_healthy

  # Crea/actualiza el usuario de la web con permisos mínimos. Se ejecuta y termina.
  db-setup:
    image: mysql:8.4
    restart: "no"
    entrypoint: ["bash", "/db-setup.sh"]
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      DB: ${MYSQL_DATABASE}
      WEB_USER: ${MYSQL_WEB_USER}
      WEB_PASSWORD: ${MYSQL_WEB_PASSWORD}
    volumes:
      - ./docker/db-setup.sh:/db-setup.sh:ro
    depends_on:
      admin:
        condition: service_healthy   # las tablas ya existen (migraciones aplicadas)

  # Copias de seguridad diarias de la base de datos y las imágenes en ./backups
  backup:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: ["bash", "/backup.sh"]
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      DB: ${MYSQL_DATABASE}
      TZ: ${APP_TIMEZONE:-UTC}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - uploads:/uploads:ro
    depends_on:
      mysql:
        condition: service_healthy

  # Blog público. MySQL: lee todo, solo puede AÑADIR comentarios y visitas. Imágenes en solo lectura.
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      <<: *laravel-env
      APP_KEY: ${WEB_APP_KEY}
      APP_URL: ${BLOG_URL}
      BLOG_DESCRIPTION: ${BLOG_DESCRIPTION}
      SESSION_DRIVER: array
      DB_USERNAME: ${MYSQL_WEB_USER}
      DB_PASSWORD: ${MYSQL_WEB_PASSWORD}
    volumes:
      - uploads:/app/public/uploads:ro
    depends_on:
      db-setup:
        condition: service_completed_successfully   # migraciones aplicadas y permisos listos

volumes:
  mysql_data:
  uploads:
